name: Publish MCP registry metadata

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Download and verify official publisher
        run: |
          curl --fail --location --retry 2 --max-time 120 https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz -o publisher.tar.gz
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  publisher.tar.gz' | sha256sum --check
          tar -xzf publisher.tar.gz mcp-publisher
      - name: Validate metadata
        run: ./mcp-publisher validate
      - name: Check published version
        id: existing
        run: |
          status=$(curl --silent --show-error --retry 2 --max-time 30 --output registry.json --write-out '%{http_code}' 'https://registry.modelcontextprotocol.io/v0.1/servers/io.github.Vomo-ai%2Fvomo/versions/1.0.0')
          case "$status" in
            200) echo 'published=true' >> "$GITHUB_OUTPUT" ;;
            404) echo 'published=false' >> "$GITHUB_OUTPUT" ;;
            *) echo "Unexpected registry status: $status"; exit 1 ;;
          esac
      - name: Authenticate with repository identity
        if: steps.existing.outputs.published == 'false'
        run: ./mcp-publisher login github-oidc
      - name: Publish metadata
        if: steps.existing.outputs.published == 'false'
        run: ./mcp-publisher publish
      - name: Verify public registry entry
        run: |
          curl --fail --silent --show-error --retry 2 --max-time 30 'https://registry.modelcontextprotocol.io/v0.1/servers/io.github.Vomo-ai%2Fvomo/versions/1.0.0' -o registry.json
          jq -e '.server.name == "io.github.Vomo-ai/vomo" and .server.version == "1.0.0" and .server.remotes[0].url == "https://mcp.vomo.ai/mcp"' registry.json
          cat registry.json
